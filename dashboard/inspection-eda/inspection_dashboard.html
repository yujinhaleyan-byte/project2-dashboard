<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입고검사 대시보드</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#1a1a19;--sub:#5f5e5a;--line:#e1e0d9;--acc:#2a78d6}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#242423;--ink:#f0efec;--sub:#b4b2a9;--line:#383835;--acc:#5b9bea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}h2{font-size:16px;font-weight:600;margin:28px 0 10px}
.sub{color:var(--sub);font-size:13px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .l{font-size:13px;color:var(--sub)}.card .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.card.hl .v{color:var(--acc)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--sub);font-size:13px}tr.tot td{font-weight:600}tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.br{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.br:last-child{border-bottom:0}.br .nm{font-size:14px;font-weight:600}
.br .tr{height:22px;background:transparent;position:relative}.br .bar{height:22px;border-radius:0 4px 4px 0;min-width:2px}
.br .val{font-size:13px;font-variant-numeric:tabular-nums;margin-left:8px;font-weight:600}
.br .meta{grid-column:2;font-size:12px;color:var(--sub);margin-top:-2px;font-variant-numeric:tabular-nums}
.br .row{display:flex;align-items:center}.badge{display:inline-block;border:1px dashed var(--sub);border-radius:4px;padding:0 6px;margin-left:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
@media(max-width:520px){.br{grid-template-columns:1fr}.br .meta{grid-column:1}}
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
.filters select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cur{font-size:14px;margin:12px 0 0}.cur b{font-weight:600}
.empty{margin-top:12px;padding:10px 14px;border:1px dashed var(--sub);border-radius:8px;font-size:14px;color:var(--ink)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--sub)}
.note li{margin:4px 0}
</style></head><body><main>
<h1>입고검사 대시보드</h1>
<p class="sub">협력사 A·B·C 납품 부품 입고검사 기록 (교육용 가상 데이터)</p>
<div class="filters"><label>협력사 <select id="fs"></select></label><label>검사주차 <select id="fw"></select></label></div>
<p class="cur" id="cur"></p>
<div class="empty" id="emp" style="display:none">검사 기록 없음</div>
<div class="cards" id="cards"></div>
<h2>협력사별 현황</h2>

<div class="bars" id="ch1"></div>

<p class="sub" style="margin-top:6px">판정미확인은 정상에 합치지 않고 별도 항목으로 표시합니다. 수량이 0인 유형도 그대로 보여줍니다.</p>

<script>
var D=JSON.parse(document.getElementById('data').textContent);
var ci=function(n){return D.cols.indexOf(n)};
var iS=ci('협력사'),iF=ci('불량여부'),iDt=ci('검사일자'),iW=ci('검사주차'),iT=ci('불량유형');
var fmt=function(n){return n.toLocaleString('ko-KR')};
var SUP=['A','B','C'];D.rows.forEach(function(r){if(SUP.indexOf(r[iS])<0)SUP.push(r[iS])});
var WK=[1,2,3,4,5,6,7,8];
var base=new Date(2026,8,1);
function md(d){return ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function wkLabel(w){var a=new Date(base.getTime());a.setDate(a.getDate()+7*(w-1));var b=new Date(a.getTime());b.setDate(b.getDate()+6);return w+'주차 ('+md(a)+' ~ '+md(b)+')'}
var fs=document.getElementById('fs'),fw=document.getElementById('fw');
fs.innerHTML='<option value="전체">전체</option>'+SUP.map(function(s){return '<option value="'+s+'">'+s+'</option>'}).join('');
fw.innerHTML='<option value="전체">전체</option>'+WK.map(function(w){return '<option value="'+w+'">'+wkLabel(w)+'</option>'}).join('');
function agg(rows){var a={n:rows.length,ok:0,unk:0,bad:0};
rows.forEach(function(r){if(r[iF]==='0'||r[iF]==='1'){a.ok++;if(r[iF]==='1')a.bad++}else a.unk++});
a.rate=a.n===0?'검사 기록 없음':a.ok>0?(a.bad/a.ok*100).toFixed(2)+'%':'계산 불가';
a.r=a.ok>0?a.bad/a.ok*100:null;return a}
function line(n,a,c){return '<tr'+(c?' class="tot"':'')+'><td>'+n+'</td><td>'+fmt(a.n)+'</td><td>'+fmt(a.ok)+'</td><td>'+fmt(a.unk)+'</td><td>'+fmt(a.bad)+'</td><td>'+a.rate+'</td></tr>'}
function render(){
var s=fs.value,w=fw.value;
var rows=D.rows.filter(function(r){return (s==='전체'||r[iS]===s)&&(w==='전체'||r[iW]===w)});
var T=agg(rows);
document.getElementById('cur').innerHTML='현재 선택: 협력사 <b>'+s+'</b> · 검사주차 <b>'+(w==='전체'?'전체':wkLabel(+w))+'</b> · 해당 기록 <b>'+fmt(rows.length)+'</b>건';
document.getElementById('emp').style.display=rows.length===0?'block':'none';
var cards=[['전체 검사수량',fmt(T.n)],['판정가능수량',fmt(T.ok)],['판정미확인수량',fmt(T.unk)],['불량수량',fmt(T.bad)],['불량률',T.rate,1]];
document.getElementById('cards').innerHTML=cards.map(function(c){return '<div class="card'+(c[2]?' hl':'')+'"><div class="l">'+c[0]+'</div><div class="v"'+(c[0]==='불량률'&&T.n===0?' style="font-size:18px"':'')+'>'+c[1]+'</div></div>'}).join('');
var list=SUP.filter(function(x){return s==='전체'||x===s});
var per=list.map(function(x){return [x,agg(rows.filter(function(r){return r[iS]===x}))]});
var h='<tr><th>협력사</th><th>검사수량</th><th>판정가능수량</th><th>판정미확인수량</th><th>불량수량</th><th>불량률</th></tr>';
per.forEach(function(x){h+=line(x[0],x[1])});
h+=line('선택 범위 전체',T,1);document.getElementById('tbl').innerHTML=h;
var all=per.concat([['선택 범위 전체',T]]);
var mx=Math.max.apply(null,all.map(function(x){return x[1].r||0}))*1.15||1;
